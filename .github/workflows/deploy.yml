name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: adrianstudy          # ← 只改这一行的项目名
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - who am I
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.86.0 whoami

      - name: Stage static site
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST/data"
          cp index.html sw.js manifest.webmanifest "$DIST/"
          if [ -f .nojekyll ]; then cp .nojekyll "$DIST/"; fi
          cp -a assets explore diagnose children "$DIST/"
          rm -f "$DIST/diagnose/README.md"
          cp data/topics.json data/dependencies.json data/cn-curriculum-standards.json \
             data/questions.json data/id-aliases.json "$DIST/data/"
          echo "staged $(find "$DIST" -type f | wc -l) files, $(du -sh "$DIST" | cut -f1)"

      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if npx --yes wrangler@4.86.0 pages project create "$PROJECT" --production-branch main > /tmp/create.log 2>&1; then
            echo "created project $PROJECT"
            cat /tmp/create.log
          else
            cat /tmp/create.log
            if grep -qi "already exists" /tmp/create.log; then
              echo "project already exists, continue"
            else
              echo "::error::project create failed, see log above"
              exit 1
            fi
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.86.0 pages deploy "$RUNNER_TEMP/dist" --project-name "$PROJECT" --branch main --commit-dirty=true
