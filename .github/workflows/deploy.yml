name: Deploy to Cloudflare Pages

# 只有你 push 到 main（或手动触发）才会部署，不会在别人的 PR 上跑。
# 使用前改两处：下面「Ensure Pages project exists」和「Deploy」里的 my-math（两处必须一致）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与仓库 scripts/deploy-cf.sh 的打包清单一致：
      # 只带 index.html / sw.js / manifest / assets / explore / diagnose / children + 5 个 JSON
      - name: Stage static site
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST/data"
          cp index.html sw.js manifest.webmanifest "$DIST/"
          if [ -f .nojekyll ]; then cp .nojekyll "$DIST/"; fi
          cp -a assets explore diagnose children "$DIST/"
          rm -f "$DIST/diagnose/README.md"
          cp data/topics.json data/dependencies.json data/cn-curriculum-standards.json \
             data/questions.json data/id-aliases.json "$DIST/data/"
          echo "staged $(find "$DIST" -type f | wc -l) files, $(du -sh "$DIST" | cut -f1)"

      # 项目已存在时这条会报错，|| true 忽略即可；真正的问题会由下一步暴露
      - name: adrianstudy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.86.0 pages project create my-math --production-branch main || true

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/dist --project-name adrianstudy --branch main
